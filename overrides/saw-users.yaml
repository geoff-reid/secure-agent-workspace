# Add real account names here after creating them with keycloak-add-users.
# Each entry creates saw-<name>. Demo entries are in saw-users-demo.yaml.
users:
  - name: dell 
    profiles:
      - custom-inference
    pruneOnRemove: true
  - name: alice 
    profiles:
      - custom-inference
    pruneOnRemove: true



# For a custom inference endpoint outside the cluster, uncomment this block
# and replace the hostname with the one in
# overrides/governance-profiles/custom-inference.yaml and inference.url.
defaults:
  openshellSaw:
    networkPolicy:
      enabled: true
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: saw-llm
              podSelector:
                matchLabels:
                  app: isvc.redhataiqwen36-35b-a3b-nvfp4-predictor
          ports:
            - protocol: TCP
              port: 8080
      clusterNetworkCIDRs:
      - 10.128.0.0/14
      serviceNetworkCIDRs:
      - 172.30.0.0/16
    cleanupApi:
      serviceIP: 172.30.0.1
      endpoints:
      - ip: 192.168.102.123
        port: 6443
