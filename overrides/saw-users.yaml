# Explicit demo workspace. Enable demo identities in the Keycloak chart too.
users:
  - name: dell
    profiles:
      - data-science
    pruneOnRemove: true
  - name: bob
    profiles:
      - data-science
    pruneOnRemove: true
    egress:
       extraAllow:
         - stack-8-bms-4.octo.dell.com
defaults:
  openshellSaw:
    networkPolicy:
      clusterNetworkCIDRs:
      - 10.128.0.0/14
      serviceNetworkCIDRs:
      - 172.30.0.0/16
    cleanupApi:
      serviceIP: 172.30.0.1
      endpoints:
      - ip: 192.168.102.122
        port: 6443